id: v6
name: V6
description: >
  Prompt-first. No Jira folder required. Analyze from the chat, then plan and
  build. Sequential. Copy this file into .openflow/flows/ to make your own.
version: "2.0"
roles: [frontend, backend, context]

steps:
  - key: analyze
    name: Analyze work item
    kind: analyze
    repos: [frontend, backend, context]
    rule_packs: [frontend, backend, context]
    human_gate: true
    artifacts:
      - openflow/changes/{ticket}/context.md
    use: default
    rules:
      - common/question-format-guide.md
      - common/overconfidence-prevention.md
      - inception/requirements-analysis.md

  - key: frontend-plan
    name: Frontend implementation doc
    kind: plan
    role: frontend
    repos: [frontend]
    depends_on: [analyze]
    human_gate: true
    use: default
    rules:
      - construction/functional-design.md

  - key: frontend-build
    name: Implement frontend
    kind: implement
    role: frontend
    repos: [frontend]
    depends_on: [frontend-plan]
    human_gate: true
    verify: true
    use: default
    skills:
      - systematic-debugging
      - verification-before-completion
      - openflow-code-review
    rules:
      - construction/code-generation.md

  - key: backend-plan
    name: Backend implementation doc
    kind: plan
    role: backend
    repos: [backend]
    depends_on: [analyze, frontend-plan]
    human_gate: true
    use: default
    rules:
      - construction/functional-design.md

  - key: backend-build
    name: Implement backend
    kind: implement
    role: backend
    repos: [backend]
    depends_on: [backend-plan]
    human_gate: true
    verify: true
    use: default
    skills:
      - systematic-debugging
      - verification-before-completion
      - openflow-code-review
    rules:
      - construction/code-generation.md

  - key: sync-context
    name: Update living context
    kind: sync-context
    role: context
    repos: [context]
    depends_on: [backend-build]
    human_gate: true
    use: default
    skills: [openflow-archive]
    rules: []
