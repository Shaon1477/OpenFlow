id: delivery-flow
name: Full Delivery
description: >
  Analyze → plan/implement per role → integrate → test → handoff → sync living
  context. Roles are config, not code: rename or drop them in a project flow.
version: "2.0"
roles: [frontend, backend, context, test]

steps:
  - key: analyze
    name: Analyze work item
    kind: analyze
    repos: [frontend, backend, context, test]
    rule_packs: [frontend, backend, context, test]
    human_gate: true
    artifacts:
      - openflow/changes/{ticket}/context.md
    skills: [openflow-run]
    rules:
      - common/session-continuity.md
      - common/welcome-message.md
      - common/depth-levels.md
      - common/overconfidence-prevention.md
      - common/question-format-guide.md
      - inception/workspace-detection.md
      - inception/requirements-analysis.md
      - inception/workflow-planning.md
      - intake/work-item-sources.md
      - intake/work-item-schema.md
      - intake/sub-items.md

  - key: frontend-plan
    name: Frontend implementation doc
    kind: plan
    role: frontend
    repos: [frontend]
    depends_on: [analyze]
    human_gate: true
    skills: [openflow-run]
    rules:
      - common/depth-levels.md
      - construction/functional-design.md

  - key: frontend-build
    name: Implement frontend
    kind: implement
    role: frontend
    repos: [frontend]
    depends_on: [frontend-plan]
    human_gate: true
    verify: true
    skills: [openflow-run, systematic-debugging, verification-before-completion, openflow-code-review]
    rules:
      - construction/code-generation.md
      - extensions/security/baseline/security-baseline.md

  - key: test-cases
    name: Write test cases
    kind: test-cases
    role: context
    repos: [context]
    depends_on: [analyze, frontend-plan]
    human_gate: true
    skills: [openflow-run]
    rules:
      - inception/requirements-analysis.md
      - common/overconfidence-prevention.md

  - key: backend-plan
    name: Backend implementation doc
    kind: plan
    role: backend
    repos: [backend]
    depends_on: [analyze, frontend-plan, test-cases]
    human_gate: true
    skills: [openflow-run]
    rules:
      - common/depth-levels.md
      - construction/functional-design.md
      - construction/nfr-requirements.md
      - construction/nfr-design.md
      - construction/infrastructure-design.md

  - key: backend-build
    name: Implement backend
    kind: implement
    role: backend
    repos: [backend]
    depends_on: [backend-plan]
    human_gate: true
    verify: true
    skills: [openflow-run, systematic-debugging, verification-before-completion, openflow-code-review]
    rules:
      - construction/code-generation.md
      - extensions/security/baseline/security-baseline.md
      - extensions/resiliency/baseline/resiliency-baseline.md

  - key: integrate
    name: Integrate frontend and backend
    kind: integrate
    role: frontend
    repos: [frontend, backend]
    depends_on: [frontend-build, backend-build]
    human_gate: true
    verify: true
    skills: [openflow-run, systematic-debugging, verification-before-completion, openflow-code-review]
    rules:
      - construction/build-and-test.md
      - extensions/resiliency/baseline/resiliency-baseline.md

  - key: test-automation
    name: Automate tests
    kind: test-automation
    role: test
    repos: [test]
    depends_on: [test-cases, integrate]
    human_gate: true
    verify: true
    skills: [openflow-run, systematic-debugging, verification-before-completion]
    rules:
      - construction/build-and-test.md
      - extensions/testing/property-based/property-based-testing.md

  - key: handoff
    name: Handoff document
    kind: handoff
    role: context
    repos: [context]
    depends_on: [integrate, test-automation]
    human_gate: true
    skills: [openflow-run]
    rules: []

  - key: sync-context
    name: Update living context
    kind: sync-context
    role: context
    repos: [context]
    depends_on: [handoff]
    human_gate: true
    skills: [openflow-run, openflow-archive]
    rules: []
