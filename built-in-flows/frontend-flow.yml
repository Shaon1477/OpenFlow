id: frontend-flow
name: Frontend Delivery
description: Single-role UI delivery that still ends with living context updated.
version: "2.0"
roles: [frontend, context, test]

steps:
  - key: analyze
    name: Analyze work item
    kind: analyze
    repos: [frontend, context, test]
    rule_packs: [frontend, context, test]
    human_gate: true
    artifacts:
      - openflow/changes/{ticket}/context.md
    skills: [openflow-run]
    rules:
      - common/session-continuity.md
      - common/depth-levels.md
      - common/overconfidence-prevention.md
      - common/question-format-guide.md
      - inception/workspace-detection.md
      - inception/requirements-analysis.md
      - inception/workflow-planning.md
      - intake/work-item-sources.md
      - intake/work-item-schema.md
      - intake/sub-items.md

  - key: frontend-plan
    name: Frontend implementation doc
    kind: plan
    role: frontend
    repos: [frontend]
    depends_on: [analyze]
    human_gate: true
    skills: [openflow-run]
    rules:
      - common/depth-levels.md
      - construction/functional-design.md

  - key: frontend-build
    name: Implement frontend
    kind: implement
    role: frontend
    repos: [frontend]
    depends_on: [frontend-plan]
    human_gate: true
    verify: true
    skills: [openflow-run, systematic-debugging, verification-before-completion, openflow-code-review]
    rules:
      - construction/code-generation.md
      - extensions/security/baseline/security-baseline.md

  - key: test-cases
    name: Write test cases
    kind: test-cases
    role: context
    repos: [context]
    depends_on: [analyze, frontend-plan]
    human_gate: true
    skills: [openflow-run]
    rules:
      - inception/requirements-analysis.md
      - common/overconfidence-prevention.md

  - key: test-automation
    name: Automate tests
    kind: test-automation
    role: test
    repos: [test]
    depends_on: [test-cases, frontend-build]
    optional: true
    human_gate: true
    verify: true
    skills: [openflow-run, systematic-debugging, verification-before-completion]
    rules:
      - construction/build-and-test.md

  - key: handoff
    name: Handoff document
    kind: handoff
    role: context
    repos: [context]
    depends_on: [frontend-build, test-cases]
    human_gate: true
    skills: [openflow-run]
    rules: []

  - key: sync-context
    name: Update living context
    kind: sync-context
    role: context
    repos: [context]
    depends_on: [handoff]
    human_gate: true
    skills: [openflow-run, openflow-archive]
    rules: []
