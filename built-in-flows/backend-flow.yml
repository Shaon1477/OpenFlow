id: backend-flow
name: Backend Delivery
description: Service-side delivery, contract-first, ending with living context updated.
version: "2.0"
roles: [backend, context, test]

steps:
  - key: analyze
    name: Analyze work item
    kind: analyze
    repos: [backend, context, test]
    rule_packs: [backend, context, test]
    human_gate: true
    artifacts:
      - openflow/changes/{ticket}/context.md
    skills: [openflow-run]
    rules:
      - common/session-continuity.md
      - common/depth-levels.md
      - common/overconfidence-prevention.md
      - common/question-format-guide.md
      - inception/workspace-detection.md
      - inception/requirements-analysis.md
      - inception/workflow-planning.md
      - intake/work-item-sources.md
      - intake/work-item-schema.md
      - intake/sub-items.md

  - key: test-cases
    name: Write test cases
    kind: test-cases
    role: context
    repos: [context]
    depends_on: [analyze]
    human_gate: true
    skills: [openflow-run]
    rules:
      - inception/requirements-analysis.md
      - common/overconfidence-prevention.md

  - key: backend-plan
    name: Backend implementation doc
    kind: plan
    role: backend
    repos: [backend]
    depends_on: [analyze, test-cases]
    human_gate: true
    skills: [openflow-run]
    rules:
      - common/depth-levels.md
      - construction/functional-design.md
      - construction/nfr-requirements.md
      - construction/nfr-design.md
      - construction/infrastructure-design.md

  - key: backend-build
    name: Implement backend
    kind: implement
    role: backend
    repos: [backend]
    depends_on: [backend-plan]
    human_gate: true
    verify: true
    skills: [openflow-run]
    rules:
      - construction/code-generation.md
      - extensions/security/baseline/security-baseline.md
      - extensions/resiliency/baseline/resiliency-baseline.md

  - key: test-automation
    name: Automate tests
    kind: test-automation
    role: test
    repos: [test]
    depends_on: [test-cases, backend-build]
    human_gate: true
    verify: true
    skills: [openflow-run]
    rules:
      - construction/build-and-test.md
      - extensions/testing/property-based/property-based-testing.md

  - key: handoff
    name: Handoff document
    kind: handoff
    role: context
    repos: [context]
    depends_on: [backend-build, test-automation]
    human_gate: true
    skills: [openflow-run]
    rules: []

  - key: sync-context
    name: Update living context
    kind: sync-context
    role: context
    repos: [context]
    depends_on: [handoff]
    human_gate: true
    skills: [openflow-run, openflow-archive]
    rules: []
