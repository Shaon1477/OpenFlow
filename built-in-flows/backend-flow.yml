id: backend-flow
name: Backend-Only Workflow
description: Backend-focused subset — skips frontend implementation and integration (optional notes only).
version: "1.0"
repos:
  - backend
  - context
  - test
steps:
  - id: 1
    name: Read Ticket
    detail_file: openflow-rule-details/steps/step-01-read-ticket.md
    repos: [backend, context, test]
    human_gate: true
    skills:
      - openspec-explore
    rules:
      - openflow-rule-details/inception/workspace-detection.md
      - openflow-rule-details/common/session-continuity.md
      - openflow-rule-details/common/welcome-message.md
      - openflow-rule-details/tracker/tracker-bridge.md
      - openflow-rule-details/tracker/subtask-collection.md
      - openflow-rule-details/inception/requirements-analysis.md
      - openflow-rule-details/common/overconfidence-prevention.md
      - openflow-rule-details/inception/workflow-planning.md
      - openflow-rule-details/common/question-format-guide.md

  - id: 2
    name: Frontend Implementation Doc
    detail_file: openflow-rule-details/steps/step-02-frontend-doc.md
    repos: []
    optional: true
    human_gate: false
    skills: []
    rules: []
    note: Skipped in backend-only flow unless UI contract documentation is needed.

  - id: 3
    name: Implement Frontend
    detail_file: openflow-rule-details/steps/step-03-frontend-impl.md
    repos: []
    optional: true
    human_gate: false
    skills: []
    rules: []
    note: Skipped in backend-only flow.

  - id: 4
    name: Write Test Cases
    detail_file: openflow-rule-details/steps/step-04-test-cases.md
    repos: [context]
    human_gate: true
    skills:
      - openspec-propose
    rules:
      - openflow-rule-details/inception/requirements-analysis.md
      - openflow-rule-details/common/overconfidence-prevention.md

  - id: 5
    name: Backend Implementation Doc
    detail_file: openflow-rule-details/steps/step-05-backend-doc.md
    repos: [backend]
    human_gate: true
    skills:
      - openspec-propose
      - openspec-new-change
      - openspec-ff-change
    rules:
      - openflow-rule-details/common/depth-levels.md
      - openflow-rule-details/construction/functional-design.md
      - openflow-rule-details/construction/nfr-requirements.md
      - openflow-rule-details/construction/nfr-design.md
      - openflow-rule-details/construction/infrastructure-design.md

  - id: 6
    name: Implement Backend
    detail_file: openflow-rule-details/steps/step-06-backend-impl.md
    repos: [backend]
    human_gate: true
    skills:
      - openspec-apply-change
      - openspec-verify-change
    rules:
      - openflow-rule-details/construction/code-generation.md
      - openflow-rule-details/extensions/security/baseline/security-baseline.md
      - openflow-rule-details/extensions/resiliency/baseline/resiliency-baseline.md

  - id: 7
    name: Backend ↔ Frontend Integration
    detail_file: openflow-rule-details/steps/step-07-integration.md
    repos: []
    optional: true
    human_gate: false
    skills: []
    rules: []
    note: Optional — enable when coordinating with an existing frontend consumer.

  - id: 8
    name: Write Test Scripts
    detail_file: openflow-rule-details/steps/step-08-test-scripts.md
    repos: [test]
    human_gate: true
    skills:
      - openspec-propose
      - openspec-apply-change
    rules:
      - openflow-rule-details/construction/build-and-test.md
      - openflow-rule-details/extensions/testing/property-based/property-based-testing.md

  - id: 9
    name: Write Jira Context Doc
    detail_file: openflow-rule-details/steps/step-09-jira-context.md
    repos: [context]
    human_gate: true
    skills:
      - openspec-propose
      - openspec-apply-change
    rules: []

  - id: 10
    name: Update Functional Context
    detail_file: openflow-rule-details/steps/step-10-functional-context.md
    repos: [context]
    human_gate: true
    skills:
      - openspec-sync-specs
      - openspec-update-change
      - openspec-archive-change
      - openspec-bulk-archive-change
    rules: []